# Global reinforcement for nginx-proxy.
#
# The run log is SSE, and on the defaults (proxy buffering on, a 60-second read timeout)
# the log arrives in lumps and then cuts off after a minute.  The pipeline runs for hours.
proxy_buffering off;
proxy_read_timeout 24h;
proxy_send_timeout 24h;

# The upload limit —— the largest body this app receives is aliases.yml.
client_max_body_size 2m;
