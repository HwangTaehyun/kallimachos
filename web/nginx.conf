server {
    listen 80;
    # Inside a container, 'localhost' resolves to ::1 first.  Without this the health check
    # keeps failing with connection refused (measured).
    listen [::]:80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # The path the frontend calls is always '/api'.  vite forwards it in development and nginx here ——
    # which is why there is no per-environment branch in the frontend code.
    location /api/ {
        # Editing aliases.yml can make the body large.  The outer proxy (ops/nginx/sse.conf) gives
        # 2m, but the path is proxy→web:80→api so **the inner one applies first** —— unset here,
        # nginx's default 1m wins and the outer setting never gets there.
        # (Go's writeYAML blocks separately with io.LimitReader 1<<20.)
        client_max_body_size 2m;
        proxy_pass http://api:8080;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # The run log is SSE and stays open for hours.  Without buffering off the log arrives in
        # lumps, and with a short read timeout it is cut off partway.
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 24h;
        proxy_send_timeout 24h;
        chunked_transfer_encoding on;
    }

    location = /healthz { access_log off; return 200 "ok\n"; }

    # Hashed assets are cached forever and index.html is never cached ——
    # a cached index pointing at an asset that no longer exists gives a white screen.
    location /assets/ { expires 1y; add_header Cache-Control "public, immutable"; }
    location = /index.html { add_header Cache-Control "no-store"; }

    # The galaxy bundle follows the same rule —— its name carries a content hash, so it is cached
    # forever, while the manifest that says which name to load is never cached.
    # (A cached manifest pointing at a deleted hash empties the main screen entirely)
    location = /galaxy/manifest.json { add_header Cache-Control "no-store"; }
    location /galaxy/ { expires 1y; add_header Cache-Control "public, immutable"; }

    # Not an SPA, but so that routing appearing later does not break it
    location / { try_files $uri $uri/ /index.html; }

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1024;
}
