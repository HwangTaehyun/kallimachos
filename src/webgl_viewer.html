<!doctype html>
<html lang="ko"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Knowledge Galaxy</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Ccircle cx='16' cy='16' r='6' fill='%235AA9FF'/%3E%3Ccircle cx='6' cy='8' r='2.5' fill='%23FFB454'/%3E%3Ccircle cx='26' cy='22' r='2.5' fill='%233FD6C0'/%3E%3C/svg%3E">
<style>
:root{
  --void:#04060D; --ink:#E8EEF6; --dim:#7C8CA0; --line:#1B2532;
  --panel:rgba(9,13,22,.72);
}
*{box-sizing:border-box}
html,body{margin:0;height:100%;overflow:hidden;background:var(--void);color:var(--ink);
  font:13px/1.55 -apple-system,'Pretendard','Apple SD Gothic Neo','Segoe UI',system-ui,sans-serif;
  -webkit-font-smoothing:antialiased}
canvas{display:block;position:absolute;inset:0}
#lbl{pointer-events:none}

.panel{position:fixed;background:var(--panel);border:1px solid var(--line);
  border-radius:10px;backdrop-filter:blur(14px) saturate(1.3);
  -webkit-backdrop-filter:blur(14px) saturate(1.3)}

/* ── The left control panel ── */
#cp{position:fixed;top:14px;left:14px;width:274px;max-height:calc(100vh - 28px);
  overflow-y:auto;padding:14px;border-radius:12px;background:rgba(9,13,22,.86);
  border:1px solid var(--line);backdrop-filter:blur(16px) saturate(1.25);
  -webkit-backdrop-filter:blur(16px) saturate(1.25);scrollbar-width:thin}
#cp::-webkit-scrollbar{width:6px}
#cp::-webkit-scrollbar-thumb{background:#25313F;border-radius:3px}
#cp.is-min>*:not(.cp-head){display:none}
.cp-head{display:flex;align-items:center;gap:8px;margin-bottom:11px}
.cp-head b{flex:1;font-size:13px;font-weight:600;letter-spacing:-.01em;
  font-variant-numeric:tabular-nums}
.cp-head button{padding:3px 8px;font-size:11px}
.cp-row{display:flex;gap:7px;margin-bottom:11px}
.cp-row button{flex:1;padding:7px 0;font-size:12px}
.cp-z{font-size:10px;letter-spacing:.13em;text-transform:uppercase;color:#63748A;
  margin:14px 0 7px;padding-top:11px;border-top:1px solid var(--line)}
.cp-z:first-of-type{border-top:0;padding-top:0}
.cp-grid{display:grid;grid-template-columns:1fr 1fr;gap:6px}
.cp-p{padding:7px 9px;border:1px solid var(--line);border-radius:8px;cursor:pointer;
  background:rgba(255,255,255,.015);transition:border-color .15s,background .15s}
.cp-p:hover{border-color:#33445A}
.cp-p.on{border-color:#5AA9FF;background:rgba(90,169,255,.11)}
.cp-p i{font-style:normal;margin-right:5px}
.cp-p b{display:block;font-size:12px;font-weight:600;letter-spacing:-.005em}
.cp-p span{display:block;margin-top:2px;font-size:10px;color:#7C8CA0;line-height:1.35}
.cp-t{display:flex;align-items:center;gap:8px;padding:3px 2px;cursor:pointer;
  font-size:12px;user-select:none;border-radius:5px;transition:opacity .15s}
.cp-t:hover{background:rgba(255,255,255,.04)}
.cp-t.off{opacity:.3}
.cp-t i{width:9px;height:9px;border-radius:50%;flex:none;box-shadow:0 0 7px currentColor}
.cp-t em{flex:1;font-style:normal}
.cp-t b{font-weight:400;font-size:11px;color:#7C8CA0;font-variant-numeric:tabular-nums}
.cp-s{display:flex;align-items:center;gap:9px;margin:9px 0}
.cp-s label{font-size:10.5px;color:#7C8CA0;letter-spacing:.05em;text-transform:uppercase;
  white-space:nowrap;min-width:52px}
.cp-s input[type=range]{flex:1;accent-color:#5AA9FF;height:2px}
.cp-s var{font-style:normal;font-size:11.5px;font-variant-numeric:tabular-nums;
  min-width:26px;text-align:right}
#cpq{width:100%;background:rgba(255,255,255,.04);border:1px solid var(--line);
  color:var(--ink);padding:7px 9px;border-radius:8px;font:12.5px inherit;outline:0}
#cpq:focus{border-color:#33445A}
#cpq::placeholder{color:#63748A}

#hud{top:18px;left:18px;padding:13px 16px 12px;pointer-events:none;display:none}
#hud h1{margin:0;font-size:14px;font-weight:600;letter-spacing:-.01em}
#hud .sub{margin-top:3px;color:var(--dim);font-size:11.5px;
  font-variant-numeric:tabular-nums;letter-spacing:.01em}

#ui{position:fixed;top:18px;right:18px;display:flex;flex-direction:column;gap:8px;align-items:stretch;width:216px}
#ui .panel{position:static;padding:9px 11px}
#q{width:100%;background:transparent;border:0;color:var(--ink);font:12.5px inherit;outline:0}
#q::placeholder{color:var(--dim)}
.row{display:flex;align-items:center;gap:9px}
.row label{color:var(--dim);font-size:10.5px;letter-spacing:.07em;text-transform:uppercase;
  white-space:nowrap}
#deg{flex:1;accent-color:#5AA9FF;height:2px}
#degv{color:var(--ink);font-size:11.5px;font-variant-numeric:tabular-nums;min-width:16px;text-align:right}
button{background:transparent;border:1px solid var(--line);color:var(--dim);white-space:nowrap;
  padding:6px 9px;border-radius:7px;cursor:pointer;font:11px inherit;letter-spacing:.03em;
  transition:color .15s,border-color .15s}
button:hover{color:var(--ink);border-color:#33445A}
button:focus-visible{outline:2px solid #5AA9FF;outline-offset:2px}

#legend{bottom:18px;left:18px;padding:10px 12px;display:flex;flex-wrap:wrap;
  gap:5px 14px;max-width:min(58vw,560px)}
#legend .t{display:flex;align-items:center;gap:6px;cursor:pointer;font-size:11px;
  color:var(--dim);letter-spacing:.02em;transition:color .15s;user-select:none}
#legend .t:hover,#legend .t.on{color:var(--ink)}
#legend .t.off{opacity:.32}
#legend i{width:8px;height:8px;border-radius:50%;flex:none;
  box-shadow:0 0 7px currentColor}
#legend b{font-weight:400;font-variant-numeric:tabular-nums;color:var(--dim);font-size:10.5px}

#tip{position:fixed;max-width:340px;padding:11px 13px;display:none;z-index:9;
  pointer-events:none;background:var(--panel);border:1px solid var(--line);
  border-radius:10px;backdrop-filter:blur(14px)}
#tip .n{font-weight:600;font-size:13.5px;letter-spacing:-.005em;line-height:1.35}
#tip .m{margin-top:4px;font-size:10.5px;color:var(--dim);letter-spacing:.05em;
  text-transform:uppercase;font-variant-numeric:tabular-nums}
#tip .d{margin-top:7px;font-size:11.5px;color:#B4C2D2;line-height:1.5}
#tip .s{margin-top:8px;padding-top:7px;border-top:1px solid var(--line);
  font-size:10.5px;line-height:1.6;word-break:break-all}
/* Links are clickable only in the pinned state —— while hovering, the tip must not block the mouse */
body.pin #tip{pointer-events:auto}
#tip .s a{color:#5AA9FF;text-decoration:none;display:block;padding:1px 0}
#tip .s a:hover{text-decoration:underline}
body.pin #tip .s::before{content:'click to open in Obsidian';display:block;
  color:#63748A;font-size:10px;margin-bottom:3px}

body.pin #hint::after{content:' · pinned (click or Esc to release)';color:#5AA9FF}
#hint{bottom:18px;right:18px;padding:8px 11px;color:var(--dim);font-size:10.5px;
  letter-spacing:.03em;pointer-events:none}
@media (max-width:720px){#legend{max-width:calc(100vw - 36px)}#ui{width:170px}#hint{display:none}}
</style></head><body>
<canvas id="gl"></canvas><canvas id="lbl"></canvas>
<div id="cp">
  <div class="cp-head"><b id="cpn">…</b>
    <button id="cpmin" aria-label="collapse the panel">−</button></div>
  <div class="cp-row"><button id="cpsearch">search</button><button id="cprst">reset view</button></div>
  <input id="cpq" placeholder="entity name…" autocomplete="off" spellcheck="false">
  <div class="cp-z">APPEARANCE</div>
  <div class="cp-grid" id="cppre"></div>
  <div class="cp-z">FILTER</div>
  <div id="cptypes"></div>
  <div class="cp-s"><label for="cpdeg">connections</label>
    <input id="cpdeg" type="range" min="1" max="40" value="1"><var id="cpdegv">1+</var></div>
  <div class="cp-z">NAVIGATE &amp; MOTION</div>
  <div class="cp-s"><label for="cpspin">auto-rotate</label>
    <input id="cpspin" type="range" min="0" max="30" value="0"><var id="cpspinv">off</var></div>
  <div class="cp-s"><label for="cplab">labels</label>
    <input id="cplab" type="range" min="0" max="260" value="130"><var id="cplabv">130</var></div>
</div>
<div id="hint" class="panel">left-drag rotate · right-drag pan · wheel zoom · hover to trace connections · <b>click to pin, then press a path to open it in Obsidian</b></div>
<div id="tip"></div>
<script>
const DATA = __DATA__;

/* ── Decoding the data ── */
function dec(b, T){const s=atob(b),u=new Uint8Array(s.length);
  for(let i=0;i<s.length;i++)u[i]=s.charCodeAt(i);return new T(u.buffer);}
const N=DATA.n, M=DATA.m;
const POS=dec(DATA.pos,Float32Array), TYPE=dec(DATA.type,Uint8Array),
      DEG=dec(DATA.deg,Uint16Array), EDGE=dec(DATA.edge,Uint32Array);
const NAME=DATA.name, DESC=DATA.desc, DOCS=DATA.docs;
const VAULT=DATA.vault||'super-brain';
const COLS=DATA.colors.map(h=>[parseInt(h.slice(1,3),16)/255,
  parseInt(h.slice(3,5),16)/255,parseInt(h.slice(5,7),16)/255]);

/* The adjacency list — CSR.  It finds neighbours instantly on hover */
const off=new Uint32Array(N+1), adj=new Uint32Array(M*2);
for(let e=0;e<M;e++){off[EDGE[e*2]+1]++;off[EDGE[e*2+1]+1]++;}
for(let i=0;i<N;i++)off[i+1]+=off[i];
{const c=off.slice(0,N);
 for(let e=0;e<M;e++){const a=EDGE[e*2],b=EDGE[e*2+1];adj[c[a]++]=b;adj[c[b]++]=a;}}

/* ── WebGL ── */
const cv=document.getElementById('gl'), lc=document.getElementById('lbl'),
      lx=lc.getContext('2d'), tip=document.getElementById('tip');
const gl=cv.getContext('webgl2',{antialias:true,alpha:false,powerPreference:'high-performance'});
if(!gl){document.body.innerHTML='<div style="padding:40px;font:14px sans-serif;color:#E8EEF6">'+
  'This browser does not support WebGL2.</div>';throw new Error('no webgl2');}

function sh(type,src){const s=gl.createShader(type);gl.shaderSource(s,src);gl.compileShader(s);
  if(!gl.getShaderParameter(s,gl.COMPILE_STATUS))throw new Error(gl.getShaderInfoLog(s));return s;}
function prog(vs,fs){const p=gl.createProgram();
  gl.attachShader(p,sh(gl.VERTEX_SHADER,vs));gl.attachShader(p,sh(gl.FRAGMENT_SHADER,fs));
  gl.linkProgram(p);
  if(!gl.getProgramParameter(p,gl.LINK_STATUS))throw new Error(gl.getProgramInfoLog(p));return p;}

/* The nebula background — fbm noise on a fullscreen triangle.  Two lobes, amber and violet, in deep space */
const pNeb=prog(`#version 300 es
in vec2 a;out vec2 uv;void main(){uv=a;gl_Position=vec4(a,0.,1.);}`,
`#version 300 es
precision highp float;in vec2 uv;out vec4 o;uniform float t;uniform vec2 res;uniform float nb;
float h(vec2 p){return fract(sin(dot(p,vec2(127.1,311.7)))*43758.5453);}
float n(vec2 p){vec2 i=floor(p),f=fract(p);f=f*f*(3.-2.*f);
  return mix(mix(h(i),h(i+vec2(1,0)),f.x),mix(h(i+vec2(0,1)),h(i+vec2(1,1)),f.x),f.y);}
float fbm(vec2 p){float v=0.,a=.5;for(int i=0;i<5;i++){v+=a*n(p);p*=2.03;a*=.5;}return v;}
void main(){
  vec2 p=uv*vec2(res.x/res.y,1.);
  float f1=fbm(p*1.5+vec2(t*.006,0.));
  float f2=fbm(p*2.3-vec2(0.,t*.004)+7.3);
  vec3 amber=vec3(.62,.34,.12), viol=vec3(.24,.15,.48);
  vec3 c=(amber*pow(f1,2.2)*.62 + viol*pow(f2,1.9)*.52)*nb;
  c+=vec3(.016,.021,.038);                       // a floor — pure black looks dead
  c*=1.-smoothstep(.15,1.5,length(uv));          // vignette (mind the argument order)
  o=vec4(c,1.);}`);
const nebVao=gl.createVertexArray();gl.bindVertexArray(nebVao);
{const b=gl.createBuffer();gl.bindBuffer(gl.ARRAY_BUFFER,b);
 gl.bufferData(gl.ARRAY_BUFFER,new Float32Array([-1,-1,3,-1,-1,3]),gl.STATIC_DRAW);
 gl.enableVertexAttribArray(0);gl.vertexAttribPointer(0,2,gl.FLOAT,false,0,0);}

/* Edges — additively blended lines.  Synapse filaments */
const pEdge=prog(`#version 300 es
in vec3 a_pos;in float a_st;uniform mat4 mvp;out float v_st;
void main(){gl_Position=mvp*vec4(a_pos,1.);v_st=a_st;}`,
`#version 300 es
precision highp float;in float v_st;out vec4 o;uniform vec3 hot;uniform float egain;uniform float ewarm;
void main(){
  if(v_st<.02){discard;}
  vec3 c=mix(mix(vec3(.34,.50,.72),vec3(1.0,.60,.26),ewarm),hot,step(1.5,v_st));
  float a=v_st<1.5?.115*v_st*egain:.75;
  o=vec4(c*a,1.);}`);

/* Nodes — point sprites.  The core and halo drawn procedurally in the fragment shader */
const pNode=prog(`#version 300 es
in vec3 a_pos;in vec3 a_col;in float a_sz;in float a_st;
uniform mat4 mvp;uniform float pxs;uniform float gain;uniform float szm;uniform float warm;
out vec3 v_col;out float v_a;out float v_hot;
void main(){
  vec4 p=mvp*vec4(a_pos,1.);gl_Position=p;
  float w=max(p.w,.001);
  float hot=step(1.8,a_st);                 // the hovered node
  float nb =step(1.2,a_st)*(1.-hot);        // its neighbours
  gl_PointSize=clamp(a_sz*szm*pxs/w*(1.+hot*.9+nb*.55),1.6,130.);
  // warm: pulled towards sunset tones.  At 1 the type colour converges on amber —— the impression of Orbits/Supernova
  v_col=mix(a_col, mix(a_col, vec3(1.0,.62,.30), .78), warm);
  v_hot=hot+nb*.45;                        // neighbours get a faint ring too
  v_a = a_st<.02 ? 0.
      : a_st<.8  ? .13                      // receded — the context stays but steps back
      : a_st<1.2 ? .95                      // ordinary
      : a_st<1.8 ? 1.15                     // a neighbour — readable without oversaturating
      : 1.6;
  v_a*= (a_st<.8||a_st>1.2) ? 1. : gain;}`,
`#version 300 es
precision highp float;in vec3 v_col;in float v_a;in float v_hot;out vec4 o;uniform float bl;
void main(){
  if(v_a<=0.){discard;}
  float r=length(gl_PointCoord-.5)*2.;
  if(r>1.){discard;}
  float core=pow(max(0.,1.-r),3.5);
  float halo=exp(-r*r*3.1)*.34;
  float ring=v_hot*smoothstep(.92,.72,r)*smoothstep(.55,.75,r)*.9;
  vec3 c=v_col*(core*1.75+halo*bl)+vec3(ring)*v_col;
  o=vec4(c*v_a,1.);}`);

/* Buffers */
const nSize=new Float32Array(N), nCol=new Float32Array(N*3), nSt=new Float32Array(N);
for(let i=0;i<N;i++){
  nSize[i]=2.4+Math.pow(DEG[i],.62)*1.55;
  const c=COLS[TYPE[i]];nCol[i*3]=c[0];nCol[i*3+1]=c[1];nCol[i*3+2]=c[2];nSt[i]=1;}
const ePos=new Float32Array(M*6), eSt=new Float32Array(M*2);
for(let e=0;e<M;e++){const a=EDGE[e*2],b=EDGE[e*2+1];
  ePos.set([POS[a*3],POS[a*3+1],POS[a*3+2]],e*6);
  ePos.set([POS[b*3],POS[b*3+1],POS[b*3+2]],e*6+3);
  eSt[e*2]=eSt[e*2+1]=1;}

function buf(data,usage){const b=gl.createBuffer();gl.bindBuffer(gl.ARRAY_BUFFER,b);
  gl.bufferData(gl.ARRAY_BUFFER,data,usage||gl.STATIC_DRAW);return b;}
const bNPos=buf(POS),bNCol=buf(nCol),bNSz=buf(nSize),bNSt=buf(nSt,gl.DYNAMIC_DRAW);
const bEPos=buf(ePos),bESt=buf(eSt,gl.DYNAMIC_DRAW);

const vaoN=gl.createVertexArray();gl.bindVertexArray(vaoN);
[[bNPos,3],[bNCol,3],[bNSz,1],[bNSt,1]].forEach(([b,n],i)=>{
  gl.bindBuffer(gl.ARRAY_BUFFER,b);gl.enableVertexAttribArray(i);
  gl.vertexAttribPointer(i,n,gl.FLOAT,false,0,0);});
const vaoE=gl.createVertexArray();gl.bindVertexArray(vaoE);
[[bEPos,3],[bESt,1]].forEach(([b,n],i)=>{
  gl.bindBuffer(gl.ARRAY_BUFFER,b);gl.enableVertexAttribArray(i);
  gl.vertexAttribPointer(i,n,gl.FLOAT,false,0,0);});
gl.bindVertexArray(null);

// A density correction — lowered as the node count grows.  Without it the centre becomes a white blob
const GAIN=Math.max(.40,Math.min(1,2600/N));
const EGAIN=Math.max(.45,Math.min(1,4200/M));

/* ── Appearance presets ──
   The layout is precomputed and cannot change, so **only the render parameters** do.
   The impression still differs plenty — bloom, starfield, nebula, edge brightness, hue. */
const PRESETS=[
 {id:'galaxy', ic:'↩', n:'Galaxy',    d:'dense core · faint arms · stars',
  bloom:1.0, star:1.0, neb:1.0, edge:1.0, size:1.0, warm:0.0},
 {id:'orbits', ic:'◉', n:'Orbits',    d:'hubs at the centre · neighbours in rings · sunset',
  bloom:1.35,star:0.8, neb:0.9, edge:1.5, size:1.1, warm:0.75},
 {id:'deep',   ic:'∴', n:'Deep Field',d:'sparse · many stars · deep black',
  bloom:0.7, star:1.9, neb:0.25,edge:0.6, size:0.85,warm:0.0},
 {id:'nebula', ic:'◌', n:'Nebula',    d:'spread cloud · no stars · neon',
  bloom:1.5, star:0.0, neb:2.1, edge:0.9, size:1.15,warm:0.0},
 {id:'minimal',ic:'∧', n:'Minimal',   d:'no bloom · no stars · restrained',
  bloom:0.35,star:0.0, neb:0.15,edge:0.8, size:0.9, warm:0.0},
 {id:'nova',   ic:'✷', n:'Supernova', d:'explosive · heavy bloom · sunset',
  bloom:2.0, star:0.9, neb:1.3, edge:1.8, size:1.35,warm:0.9},
];
let PRE=PRESETS[1];                       // Orbits by default — matching the plugin's default

/* The starfield — background points unrelated to the graph.  They give a sense of depth */
const pStar=prog(`#version 300 es
in vec3 a_pos;in float a_b;uniform mat4 mvp;uniform float pxs;out float v_b;
void main(){vec4 p=mvp*vec4(a_pos,1.);gl_Position=p;
  gl_PointSize=clamp(a_b*pxs/max(p.w,.001)*.5,1.,4.5);v_b=a_b;}`,
`#version 300 es
precision highp float;in float v_b;out vec4 o;uniform float amt;
void main(){float r=length(gl_PointCoord-.5)*2.;if(r>1.){discard;}
  float g=pow(max(0.,1.-r),2.2);
  o=vec4(vec3(.82,.86,.95)*g*v_b*.5*amt,1.);}`);
const STAR=2600;
{const sp=new Float32Array(STAR*3), sb=new Float32Array(STAR);
 let sd=12345; const rnd=()=>{sd=(sd*1103515245+12345)&0x7fffffff;return sd/0x7fffffff;};
 for(let i=0;i<STAR;i++){
   const th=rnd()*Math.PI*2, ph=Math.acos(2*rnd()-1), r=260+rnd()*340;
   sp[i*3]=r*Math.sin(ph)*Math.cos(th); sp[i*3+1]=r*Math.cos(ph);
   sp[i*3+2]=r*Math.sin(ph)*Math.sin(th); sb[i]=.35+rnd()*rnd()*1.9;}
 var vaoS=gl.createVertexArray(); gl.bindVertexArray(vaoS);
 [[sp,3],[sb,1]].forEach((x,i)=>{const b=gl.createBuffer();
   gl.bindBuffer(gl.ARRAY_BUFFER,b);gl.bufferData(gl.ARRAY_BUFFER,x[0],gl.STATIC_DRAW);
   gl.enableVertexAttribArray(i);gl.vertexAttribPointer(i,x[1],gl.FLOAT,false,0,0);});
 gl.bindVertexArray(null);}

/* ── Matrices ── */
function persp(f,a,n,fa){const t=1/Math.tan(f/2);
  return new Float32Array([t/a,0,0,0, 0,t,0,0, 0,0,(fa+n)/(n-fa),-1, 0,0,2*fa*n/(n-fa),0]);}
function look(e,c,u){
  let z=[e[0]-c[0],e[1]-c[1],e[2]-c[2]];let l=Math.hypot(...z);z=z.map(v=>v/l);
  let x=[u[1]*z[2]-u[2]*z[1],u[2]*z[0]-u[0]*z[2],u[0]*z[1]-u[1]*z[0]];
  l=Math.hypot(...x)||1;x=x.map(v=>v/l);
  const y=[z[1]*x[2]-z[2]*x[1],z[2]*x[0]-z[0]*x[2],z[0]*x[1]-z[1]*x[0]];
  return new Float32Array([x[0],y[0],z[0],0, x[1],y[1],z[1],0, x[2],y[2],z[2],0,
    -(x[0]*e[0]+x[1]*e[1]+x[2]*e[2]),-(y[0]*e[0]+y[1]*e[1]+y[2]*e[2]),
    -(z[0]*e[0]+z[1]*e[1]+z[2]*e[2]),1]);}
function mul(a,b){const o=new Float32Array(16);
  for(let i=0;i<4;i++)for(let j=0;j<4;j++){let s=0;
    for(let k=0;k<4;k++)s+=a[k*4+j]*b[i*4+k];o[i*4+j]=s;}return o;}

/* ── The camera ── */
const cam={th:.6,ph:1.15,r:225,tx:0,ty:0,spin:false,spinSpeed:.0016};
let mvp=null, W=0,H=0,DPR=1;
function resize(){DPR=Math.min(devicePixelRatio||1,2);
  W=innerWidth;H=innerHeight;
  cv.width=W*DPR;cv.height=H*DPR;cv.style.width=W+'px';cv.style.height=H+'px';
  lc.width=W*DPR;lc.height=H*DPR;lc.style.width=W+'px';lc.style.height=H+'px';
  lx.setTransform(DPR,0,0,DPR,0,0);
  gl.viewport(0,0,cv.width,cv.height);}
addEventListener('resize',resize);resize();

const scr=new Float32Array(N*3);   // x, y, w (depth)
function project(){
  for(let i=0;i<N;i++){
    const x=POS[i*3],y=POS[i*3+1],z=POS[i*3+2];
    const cx=mvp[0]*x+mvp[4]*y+mvp[8]*z+mvp[12];
    const cy=mvp[1]*x+mvp[5]*y+mvp[9]*z+mvp[13];
    const cw=mvp[3]*x+mvp[7]*y+mvp[11]*z+mvp[15];
    scr[i*3]=(cx/cw*.5+.5)*W;scr[i*3+1]=(1-(cy/cw*.5+.5))*H;scr[i*3+2]=cw;}}

/* ── State: hover · search · type · minimum connections ── */
let hover=-1, pinned=-1, query='', minDeg=1, LABELS=130;
const typeOn=DATA.types.map(()=>true);
const inSet=new Uint8Array(N);      // does it pass the filter

function applyFilter(){
  const q=query.trim().toLowerCase();
  for(let i=0;i<N;i++){
    inSet[i]=(typeOn[TYPE[i]] && DEG[i]>=minDeg &&
      (!q || NAME[i].toLowerCase().includes(q)))?1:0;}
  paint();}

function paint(){
  const nb=hover>=0?new Set(adj.subarray(off[hover],off[hover+1])):null;
  for(let i=0;i<N;i++){
    if(!inSet[i]){nSt[i]=0;continue;}
    if(hover<0){nSt[i]=1;}
    else if(i===hover){nSt[i]=2;}
    else if(nb.has(i)){nSt[i]=1.5;}
    else{nSt[i]=.5;}}                       // receded — alpha 0.085
  for(let e=0;e<M;e++){
    const a=EDGE[e*2],b=EDGE[e*2+1];
    let s;
    if(!inSet[a]||!inSet[b])s=0;
    else if(hover<0)s=1;
    else s=(a===hover||b===hover)?2:0;      // on hover, only that node's edges
    eSt[e*2]=eSt[e*2+1]=s;}
  gl.bindBuffer(gl.ARRAY_BUFFER,bNSt);gl.bufferSubData(gl.ARRAY_BUFFER,0,nSt);
  gl.bindBuffer(gl.ARRAY_BUFFER,bESt);gl.bufferSubData(gl.ARRAY_BUFFER,0,eSt);}

/* ── Labels ── */
const rank=Array.from({length:N},(_,i)=>i).sort((a,b)=>DEG[b]-DEG[a]);
function labels(){
  lx.clearRect(0,0,W,H);
  lx.font='500 11.5px -apple-system,Pretendard,"Apple SD Gothic Neo",system-ui,sans-serif';
  lx.textBaseline='middle';
  const drawn=[];   // [x0,y0,x1,y1] — the actual text boxes
  const gapY=hover>=0?11:13;
  const put=(i,alpha,bold)=>{
    const x=scr[i*3],y=scr[i*3+1];
    if(scr[i*3+2]<=0||x<-90||x>W+90||y<-24||y>H+24)return;
    const t=NAME[i].length>26?NAME[i].slice(0,25)+'…':NAME[i];
    const px=x+7+Math.pow(DEG[i],.62)*.8;
    lx.font=(bold?'600 12.5px ':'500 11.5px ')+
      '-apple-system,Pretendard,"Apple SD Gothic Neo",system-ui,sans-serif';
    // Judging overlap at a fixed width (74px) lets long names cut into each other.  Measured widths are used.
    const w=lx.measureText(t).width;
    const b=[px-2,y-gapY/2,px+w+2,y+gapY/2];
    for(const d of drawn) if(b[0]<d[2]&&b[2]>d[0]&&b[1]<d[3]&&b[3]>d[1])return;
    drawn.push(b);
    lx.lineWidth=4.2;lx.strokeStyle='rgba(4,6,13,.96)';lx.strokeText(t,px,y);
    lx.fillStyle=bold?'rgba(255,255,255,'+alpha+')':'rgba(214,226,240,'+alpha+')';
    lx.fillText(t,px,y);};
  if(hover>=0){
    put(hover,1,true);
    const nb=adj.subarray(off[hover],off[hover+1]);
    const srt=Array.from(nb).filter(i=>inSet[i]).sort((a,b)=>DEG[b]-DEG[a]).slice(0,26);
    for(const i of srt) put(i,.92,false);
  }else{
    // Picking only the top by degree puts 87% of the labels at the centre (hubs are heavy and do not get pushed out).
    // The screen is gridded and each cell keeps its highest-degree one — so names survive at the edges too.
    const CW=190,CH=86,cell=new Map();
    for(const i of rank){
      if(!inSet[i]||scr[i*3+2]<=0)continue;
      const x=scr[i*3],y=scr[i*3+1];
      if(x<0||x>W||y<0||y>H)continue;
      const k=((y/CH)|0)*9999+((x/CW)|0);
      if(cell.has(k))continue;
      cell.set(k,i);
      if(cell.size>=LABELS)break;}
    for(const i of cell.values()) put(i,.78,DEG[i]>34);}}

/* ── Drawing ── */
let t0=performance.now();
function draw(){
  const t=(performance.now()-t0)/1000;
  if(cam.spin)cam.th+=(cam.spinSpeed||.0016);
  const ex=cam.r*Math.sin(cam.ph)*Math.cos(cam.th),
        ey=cam.r*Math.cos(cam.ph),
        ez=cam.r*Math.sin(cam.ph)*Math.sin(cam.th);
  const ctr=[cam.tx,cam.ty,0];
  mvp=mul(persp(50*Math.PI/180,W/H,1,4000),
          look([ex+cam.tx,ey+cam.ty,ez],ctr,[0,1,0]));

  gl.disable(gl.DEPTH_TEST);
  gl.useProgram(pNeb);gl.bindVertexArray(nebVao);
  gl.disable(gl.BLEND);
  gl.uniform1f(gl.getUniformLocation(pNeb,'t'),t);
  gl.uniform2f(gl.getUniformLocation(pNeb,'res'),W,H);
  gl.uniform1f(gl.getUniformLocation(pNeb,'nb'),PRE.neb);
  gl.drawArrays(gl.TRIANGLES,0,3);

  gl.enable(gl.BLEND);gl.blendFunc(gl.ONE,gl.ONE);
  if(PRE.star>0){                                  // the starfield goes behind the graph
    gl.useProgram(pStar);gl.bindVertexArray(vaoS);
    gl.uniformMatrix4fv(gl.getUniformLocation(pStar,'mvp'),false,mvp);
    gl.uniform1f(gl.getUniformLocation(pStar,'pxs'),H*DPR*.55);
    gl.uniform1f(gl.getUniformLocation(pStar,'amt'),PRE.star);
    gl.drawArrays(gl.POINTS,0,STAR);}

  gl.useProgram(pEdge);gl.bindVertexArray(vaoE);
  gl.uniformMatrix4fv(gl.getUniformLocation(pEdge,'mvp'),false,mvp);
  gl.uniform3f(gl.getUniformLocation(pEdge,'hot'),.62,.80,1.0);
  gl.uniform1f(gl.getUniformLocation(pEdge,'egain'),EGAIN*PRE.edge);
  gl.uniform1f(gl.getUniformLocation(pEdge,'ewarm'),PRE.warm);
  gl.drawArrays(gl.LINES,0,M*2);

  gl.useProgram(pNode);gl.bindVertexArray(vaoN);
  gl.uniformMatrix4fv(gl.getUniformLocation(pNode,'mvp'),false,mvp);
  gl.uniform1f(gl.getUniformLocation(pNode,'pxs'),H*DPR*.55);
  gl.uniform1f(gl.getUniformLocation(pNode,'gain'),GAIN);
  gl.uniform1f(gl.getUniformLocation(pNode,'szm'),PRE.size);
  gl.uniform1f(gl.getUniformLocation(pNode,'warm'),PRE.warm);
  gl.uniform1f(gl.getUniformLocation(pNode,'bl'),PRE.bloom);
  gl.drawArrays(gl.POINTS,0,N);

  project();labels();
  requestAnimationFrame(draw);}

/* ── Input ── */
let drag=null, dragMoved=false;
cv.addEventListener('pointerdown',e=>{dragMoved=false;drag={x:e.clientX,y:e.clientY,b:e.button};
  cv.setPointerCapture(e.pointerId);});
cv.addEventListener('pointerup',e=>{drag=null;});
cv.addEventListener('pointermove',e=>{
  if(drag){
    const dx=e.clientX-drag.x,dy=e.clientY-drag.y;drag.x=e.clientX;drag.y=e.clientY;
    if(Math.abs(dx)+Math.abs(dy)>2)dragMoved=true;
    if(drag.b===2||e.shiftKey){cam.tx-=dx*cam.r*.0016;cam.ty+=dy*cam.r*.0016;}
    else{cam.th-=dx*.0055;cam.ph=Math.max(.08,Math.min(Math.PI-.08,cam.ph-dy*.0055));}
    return;}
  const mx=e.clientX,my=e.clientY;
  let best=-1,bd=1e9;
  for(let i=0;i<N;i++){
    if(!inSet[i]||scr[i*3+2]<=0)continue;
    const dx=scr[i*3]-mx,dy=scr[i*3+1]-my,d=dx*dx+dy*dy;
    const rad=Math.max(9,3+Math.pow(DEG[i],.62)*1.9);
    if(d<rad*rad&&d<bd){bd=d;best=i;}}
  if(pinned>=0){return;}
  if(best!==hover){hover=best;paint();}
  if(best>=0){
    const c=DATA.colors[TYPE[best]];
    tip.innerHTML='<div class="n" style="color:'+c+'">'+esc(NAME[best])+'</div>'+
      '<div class="m">'+DATA.types[TYPE[best]]+' · connections '+DEG[best]+'</div>'+
      (DESC[best]?'<div class="d">'+esc(DESC[best])+'</div>':'')+
      (DOCS[best]&&DOCS[best].length?'<div class="s">'+
        DOCS[best].map(d=>{
          // obsidian://open?vault=…&file=… —— the desktop app opens that note.
          // file is the vault-relative path with the extension removed.
          const f=d.replace(/\.md$/,'');
          return `<a href="obsidian://open?vault=${encodeURIComponent(VAULT)}`+
                 `&file=${encodeURIComponent(f)}" title="${esc(d)}">`+
                 esc(d.split('/').slice(-2).join('/'))+'</a>';
        }).join('')+'</div>':'');
    tip.style.display='block';
    const r=tip.getBoundingClientRect();
    // Cursor on the left half → show on the right, and vice versa — so it does not cover neighbouring nodes
    tip.style.left=(mx<innerWidth/2 ? innerWidth-r.width-18 : 18)+'px';
    tip.style.top=Math.max(96,Math.min(my-r.height/2,innerHeight-r.height-64))+'px';
  }else tip.style.display='none';});
cv.addEventListener('pointerleave',()=>{if(pinned<0&&hover>=0){hover=-1;paint();tip.style.display='none';}});
cv.addEventListener('click',e=>{
  if(dragMoved){return;}                       // the click at the end of a rotate drag is ignored
  if(pinned>=0){pinned=-1;document.body.classList.remove('pin');}
  else if(hover>=0){pinned=hover;document.body.classList.add('pin');}});
addEventListener('keydown',e=>{if(e.key==='Escape'&&pinned>=0){
  pinned=-1;document.body.classList.remove('pin');hover=-1;paint();tip.style.display='none';}});
cv.addEventListener('contextmenu',e=>e.preventDefault());
cv.addEventListener('wheel',e=>{e.preventDefault();
  cam.r=Math.max(28,Math.min(1400,cam.r*Math.exp(e.deltaY*.0011)));},{passive:false});
function esc(s){return String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));}

/* ── Chrome ── */

/* ── The control panel ── */
const $=id=>document.getElementById(id);
$('cpn').textContent=`entities ${N.toLocaleString()} · relations ${M.toLocaleString()}`;

// Presets
const preHost=$('cppre');
PRESETS.forEach(pz=>{
  const el=document.createElement('div');
  el.className='cp-p'+(pz===PRE?' on':'');
  el.innerHTML=`<b><i>${pz.ic}</i>${pz.n}</b><span>${pz.d}</span>`;
  el.onclick=()=>{PRE=pz;[...preHost.children].forEach((c,i)=>
    c.classList.toggle('on',PRESETS[i]===PRE));};
  preHost.appendChild(el);});

// The type filter —— **entity types**, not folders
const tHost=$('cptypes');
DATA.types.forEach((tn,i)=>{
  const el=document.createElement('div');
  el.className='cp-t'; el.tabIndex=0; el.setAttribute('role','switch');
  el.setAttribute('aria-checked','true'); el.setAttribute('aria-label','toggle '+tn);
  el.innerHTML=`<i style="background:${DATA.colors[i]};color:${DATA.colors[i]}"></i>`+
    `<em>${tn}</em><b>${DATA.counts[i].toLocaleString()}</b>`;
  const tog=()=>{typeOn[i]=!typeOn[i];el.classList.toggle('off',!typeOn[i]);
    el.setAttribute('aria-checked',String(typeOn[i]));applyFilter();};
  el.onclick=tog;
  el.onkeydown=e=>{if(e.key==='Enter'||e.key===' '){e.preventDefault();tog();}};
  tHost.appendChild(el);});

$('cpq').addEventListener('input',e=>{query=e.target.value;applyFilter();});
$('cpsearch').onclick=()=>$('cpq').focus();
$('cprst').onclick=()=>{cam.th=.6;cam.ph=1.15;cam.r=225;cam.tx=cam.ty=0;};
$('cpmin').onclick=()=>{const c=$('cp');c.classList.toggle('is-min');
  $('cpmin').textContent=c.classList.contains('is-min')?'+':'−';};

const dEl=$('cpdeg'),dV=$('cpdegv');
{const srt=Array.from(DEG).sort((a,b)=>a-b);
 dEl.max=String(Math.max(12,Math.min(40,srt[Math.floor(srt.length*.995)]||12)));}
dEl.addEventListener('input',e=>{minDeg=+e.target.value;dV.textContent=minDeg+'+';applyFilter();});

const spEl=$('cpspin'),spV=$('cpspinv');
spEl.addEventListener('input',e=>{const v=+e.target.value;
  cam.spin=v>0; cam.spinSpeed=v/10000;
  spV.textContent=v>0?(v/10).toFixed(1)+'×':'off';});

const lbEl=$('cplab'),lbV=$('cplabv');
lbEl.addEventListener('input',e=>{LABELS=+e.target.value;lbV.textContent=LABELS||'off';});

applyFilter();draw();
</script></body></html>
